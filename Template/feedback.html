{% extends "base.html "%}
{% load static %}

{% block class %} class="sub_page" {% endblock class %}
{% block feedback_status %}active{% endblock feedback_status %}

{% block main %}

<!-- Start Feedback form -->


  <section class="book_section layout_padding">
    <div class="container">
      <div class="heading_container">
        <h2>
          Feedback
        </h2>
      </div>
      <div class="row">
        <div class="col-md-6">
          <div class="form_container">
            <form action="">
              <div>
                <input type="text" class="form-control" required placeholder="Your Name" />
              </div>
              <div>
                <textarea class="form-control" id="exampleFormControlTextarea1" name="Description" rows="3"  required placeholder="Describe your experience here " ></textarea>
                
              
              <div>
                <select class="form-control nice-select wide">
                  <option value="" disabled selected>
                    Please, Gives Us Rating...
                  </option>
                  <option value="1">
                    1
                  </option>
                  <option value="">
                    2
                  </option>
                  <option value="">
                    3
                  </option>
                  <option value="">
                    4
                  </option>
                  <option value="">
                    5
                  </option>
                </select>
              </div>
              <div>
                <label for="formFileLg" class="form-label"Select Your Image></label>
                <input class="form-control form-control-lg" id="formFileLg" type="Image">
              </div>
              
              <div class="btn_box">
                <button>
                 Submit
                </button>
              </div>
            </form>
          </div>
        </div>
       
      </div>
    </div>
  </section>
 



<!-- End Feedback form -->


{% endblock %}
